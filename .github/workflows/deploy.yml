name: CI/CD Pipeline - TriviaWar Backend

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. TRABAJO DE CONSTRUCCIÓN Y EMPUJE A GHCR
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Log in a GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Preparar nombre de la imagen en minúsculas
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build y Push de la imagen Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.IMAGE_NAME }}:latest

  # 2. TRABAJO DE DESPLIEGUE POR SSH (vía Cloudflare Tunnel)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout del código (para obtener el docker-compose.yml)
        uses: actions/checkout@v4

      # Paso crítico: Instalar cloudflared para poder atravesar el túnel
      - name: Instalar Cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # Configuramos SSH para que use cloudflared como ProxyCommand
      # IMPORTANTE: Eliminamos ssh-keyscan porque el túnel de Cloudflare no permite escaneo convencional
      - name: Configurar Túnel SSH con Cloudflare Access
        run: |
          mkdir -p ~/.ssh
          # Creamos la configuración para que SSH 'sepa' que debe usar cloudflared
          cat <<EOF > ~/.ssh/config
          Host ${{ secrets.SERVER_HOST }}
            HostName ${{ secrets.SERVER_HOST }}
            User roberto
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand /usr/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}
          EOF
          chmod 600 ~/.ssh/config

      # Instalamos sshpass para pasar la contraseña al comando ssh nativo del runner
      - name: Instalar sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # Paso de Verificación (Ping de conexión) propuesto por el usuario
      # Usamos sshpass con el comando ssh nativo que SÍ lee el archivo ~/.ssh/config creado anteriormente
      - name: Verificar Conexión al Túnel (Health Check)
        run: |
          echo "✅ Intentando conexión SSH segura a través del túnel de Cloudflare..."
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o ConnectTimeout=20 ${{ secrets.SERVER_HOST }} "echo '✅ ¡Conexión establecida con éxito hacia el Asustor por Cloudflare!'; uname -a; uptime"

      # Despliegue final usando el mismo método nativo y robusto
      - name: Desplegar en el Servidor (Asustor)
        run: |
          echo "🚀 Iniciando despliegue en el servidor remoto..."
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh ${{ secrets.SERVER_HOST }} "bash -s" << 'EOF'
            set -e
            # 1. Entrar a la carpeta del proyecto
            cd /mnt/asustor_data/25-DOCKER/triviawar-back
            
            # 2. Crear/Actualizar archivos de secretos desde GitHub
            echo "${{ secrets.ENV_FILE_CONTENT }}" > .env
            echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service-account.json
            
            # 3. Loguearse en GHCR dentro del servidor
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 4. Actualizar la imagen y reiniciar los contenedores con Docker Compose
            docker compose pull
            docker compose up -d
            
            # 5. Limpiar imágenes viejas para ahorrar espacio
            docker image prune -f
            echo "✅ Despliegue completado con éxito."
          EOF
